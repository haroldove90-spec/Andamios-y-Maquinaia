<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="scaffGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#f59e0b" stroke-width="8" stroke-dasharray="16 12" opacity="0.4"/>
  
  <!-- Scaffolding Frame -->
  <!-- Left post -->
  <rect x="120" y="100" width="22" height="300" rx="6" fill="url(#scaffGrad)" />
  <!-- Right post -->
  <rect x="370" y="100" width="22" height="300" rx="6" fill="url(#scaffGrad)" />
  <!-- Top horizontal bar -->
  <rect x="110" y="130" width="292" height="18" rx="5" fill="#f8fafc" />
  <!-- Middle horizontal bar -->
  <rect x="110" y="246" width="292" height="18" rx="5" fill="#f8fafc" />
  <!-- Bottom horizontal bar -->
  <rect x="110" y="360" width="292" height="18" rx="5" fill="#f8fafc" />
  
  <!-- Diagonal Cross Bracing (Crucetas) -->
  <line x1="131" y1="140" x2="381" y2="250" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
  <line x1="381" y1="140" x2="131" y2="250" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
  <line x1="131" y1="250" x2="381" y2="360" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
  <line x1="381" y1="250" x2="131" y2="360" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
  <!-- Central joint bolts -->
  <circle cx="256" cy="195" r="10" fill="#0f172a" stroke="#ffffff" stroke-width="4"/>
  <circle cx="256" cy="305" r="10" fill="#0f172a" stroke="#ffffff" stroke-width="4"/>
  
  <!-- Base wheels / leveling screws -->
  <circle cx="131" cy="415" r="16" fill="#f8fafc" stroke="#f59e0b" stroke-width="5"/>
  <circle cx="381" cy="415" r="16" fill="#f8fafc" stroke="#f59e0b" stroke-width="5"/>
  
  <!-- Industrial Machinery Gear Badge in center bottom -->
  <g transform="translate(256, 305) scale(0.65)">
    <!-- Gear cog badge -->
    <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="#f59e0b" stroke-width="10"/>
    <path d="M-8,-52 L8,-52 L6,-42 L-6,-42 Z
             M-8,52 L8,52 L6,42 L-6,42 Z
             M-52,-8 L-52,8 L-42,6 L-42,-6 Z
             M52,-8 L52,8 L42,6 L42,-6 Z
             M-38,-38 L-26,-48 L-20,-38 L-32,-28 Z
             M38,38 L26,48 L20,38 L32,28 Z
             M38,-38 L48,-26 L38,-20 L28,-32 Z
             M-38,38 L-48,26 L-38,20 L-28,32 Z" fill="#f59e0b" />
    <circle cx="0" cy="0" r="22" fill="#f59e0b"/>
    <polygon points="0,-12 12,0 0,12 -12,0" fill="#0f172a"/>
  </g>
</svg>
